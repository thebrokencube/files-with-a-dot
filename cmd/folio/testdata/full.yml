schema: 1
project: "Full Featured Project"

sources:
  - path: README.md
  - external: jira
    id: "ACME-123"
    notes: "Original ticket"
  - path: reference/cached.md
    derived_from:
      - external: web
        url: "https://example.com/article"
        cached: "2026-01-15"
        notes: "Summarized article"
  - external: github
    id: "Org/repo"
    path: "app/models/user.rb"

repositories:
  myrepo: "https://github.com/Org/repo/blob/main/{path}"

targets:
  summary:
    how: "Condense research into summary"
    sources:
      - path: README.md
    outputs:
      - path: compiled/summary.md

  jira-update:
    how: "Push summary to Jira"
    blocked_by: [summary]
    sources:
      - path: compiled/summary.md
    outputs:
      - external: jira
        id: "ACME-123"
        field: description
      - path: compiled/jira-update.md

  feature-branch:
    how: "Compile feature to PR"
    blocked_by: [summary]
    branch: "feat/my-feature"
    pr: "#42"
    sources:
      - path: README.md
    outputs:
      - path: compiled/feature.md
    tree:
      system: jira
      field: description
      root:
        id: "ACME-200"
        label: "Feature Root"
        sync: pull
        children:
          - id: "ACME-201"
            label: "Sub-task"

cross_references:
  - fact: "Key finding"
    source_of_truth: "README.md"
    also_appears_in:
      - "reference/cached.md"

tasks:
  - "Review findings"

pending:
  - "Waiting on stakeholder feedback"
