# Shared defaults — system type -> access method
# The folio skill resolves external targets through this file.
# Unlisted systems: pull = skip, push = manual
# Advisory — folio jira commands internalize the Jira pipeline.
# Entries document what each system uses for reference.

systems:
  jira:
    pull: cli:acli
    push: "folio jira push --id {id} --source {source}"
    check: "acli --version"
    lint: "folio jira lint {source}"
    compile: "folio jira compile --id {id} --source {source} --output {compiled}"
    create: "folio jira create --json {compiled} --source {source}"
  confluence:
    pull: mcp:jira-confluence
    push: mcp:jira-confluence
  google_docs:
    pull: mcp:gdrive
    push: manual:paste-from-markdown
  google_slides:
    pull: mcp:gdrive
    push: manual
  github:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  github_pr:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  slack:
    pull: mcp:slack
    push: mcp:slack
