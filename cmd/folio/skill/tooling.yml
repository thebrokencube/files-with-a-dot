# Shared defaults — system type -> access method
# The folio skill resolves external targets through this file.
# Unlisted systems: pull = skip, push = manual

systems:
  jira:
    pull: cli:acli
    push: cli:acli
    check: "acli --version"
    precompile: "md-to-adf --acli {id} < {source} > {compiled}"
    lint: "md-to-adf --lint {source}"
    create: "acli jira workitem create --from-json {compiled}"
  confluence:
    pull: mcp:jira-confluence
    push: mcp:jira-confluence
  google_docs:
    pull: mcp:gdrive
    push: manual:paste-from-markdown
  google_slides:
    pull: mcp:gdrive
    push: manual
  github:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  github_pr:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  slack:
    pull: mcp:slack
    push: mcp:slack
