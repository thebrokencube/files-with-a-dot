# Shared defaults — system type -> access method
# The folio skill resolves external targets through this file.
# Unlisted systems: pull = skip, push = manual
# Advisory — jf (Jira Forest CLI) handles the Jira pipeline.
# Entries document what each system uses for reference.
#
# Fallback pattern (Jira): acli is the primary tool for all write operations.
# When acli can't discover custom fields (e.g., Components, Ownership Area),
# use MCP getJiraIssueTypeMetaWithFields for metadata discovery, then acli
# for execution. MCP Jira tools are read-only in the publish workflow.
#
# Token budget (Jira MCP reads): Always pass the fields parameter.
# Standard: summary,status,assignee,description,priority,issuetype,parent,subtasks,issuelinks,labels,comment
# Minimal: summary,status (for dashboards/batch checks)
# Extended: add changelog (for history/transition tracking)
# A bare getJiraIssue returns ~100KB (~25-30K tokens), 91% waste.
#
# Response format (Jira MCP reads): Use responseContentFormat: "markdown"
# on getJiraIssue, searchJiraIssuesUsingJql, editJiraIssue.
# Est. 60-70% token reduction over default ADF responses.
# Combine with fields parameter for maximum reduction.

systems:
  jira:
    pull: cli:acli
    push: "jf push {id} {source}"
    check: "jf --version"
    create: "jf create-missing"
  confluence:
    pull: mcp:jira-confluence
    push: mcp:jira-confluence
  google_docs:
    pull: mcp:gdrive
    push: manual:paste-from-markdown
  google_slides:
    pull: mcp:gdrive
    push: manual
  github:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  github_pr:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  slack:
    pull: mcp:slack
    push: mcp:slack
