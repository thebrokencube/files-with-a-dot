name: ci

on: [push, pull_request]

# Cancel superseded in-progress runs on the same ref so a burst of pushes
# doesn't pile up redundant check runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [folio, jf, dendrik]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/${{ matrix.tool }}/go.mod
          # monorepo: module files live per-tool, not at repo root — point the cache there
          cache-dependency-path: cmd/${{ matrix.tool }}/go.sum
      - name: check
        working-directory: cmd/${{ matrix.tool }}
        run: |
          make check
          go build -o /dev/null .   # compile check; no artifact, never clobbers the committed binary
      - name: working tree clean (gofmt)
        run: git diff --exit-code

  # pkg/dendrik is a separate Go module consumed by the cmd/ tools via a replace
  # directive, so the per-tool `go test ./...` in the `check` job never reaches it.
  # The dendrik library every tool imports needs its own gate — without this the
  # foundation is CI-unguarded.
  pkg-dendrik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: pkg/dendrik/go.mod
          cache-dependency-path: pkg/dendrik/go.sum
      - name: check
        working-directory: pkg/dendrik
        run: |
          test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # coupling check compares against the base ref
      # Plugin surface: catalogs are generated from each plugin.json.version. Regenerate and
      # assert no drift — a stale catalog version blocks plugin auto-update. jq is preinstalled.
      - name: catalogs match plugin.json.version (regenerate + no drift)
        run: |
          scripts/marketplace-generate
          git diff --exit-code
      # Building-block map is a pure projection of the //dendrik: source tags. Regenerate and
      # assert no drift — a stale map means a blueprint's composes: ids resolve to wrong facts.
      - name: "building-block map matches //dendrik tags (regenerate + no drift)"
        run: |
          scripts/generate-building-blocks
          git diff --exit-code
      # Binary↔plugin coupling: a binary VERSION bump must carry a plugin.json.version bump, or
      # the new binary never reaches users (auto-update fires on the plugin version). The two
      # versions are otherwise independent (skill-only changes bump the plugin version alone).
      - name: binary bump requires plugin bump
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            git fetch -q --depth=1 origin main
            BASE=origin/main
          fi
          scripts/check-version-coupling "$BASE"
