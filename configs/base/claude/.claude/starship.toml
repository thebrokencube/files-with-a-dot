"$schema" = "https://starship.rs/config-schema.json"

# Claude Code statusline - colors match the shell prompt (configs/base/starship)

add_newline = false

# directory + jj/git + Claude model/context/cost
format = """
$directory \
${custom.jj}\
${custom.git_branch} \
${env_var.CLAUDE_MODEL} \
${env_var.CLAUDE_CONTEXT} \
${env_var.CLAUDE_COST}\
"""

[directory]
style = "bold cyan"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true

# Native git_branch prints literal "HEAD" on jj's detached HEAD, so it's driven
# through custom.git_branch (gated to non-jj repos) instead of the format.
[git_branch]
disabled = true

# jj change id + bookmarks. Only runs in jj repos (detect_folders = .jj).
# --ignore-working-copy => never snapshots/mutates, so it can't race the shell
# prompt rendering the same repo. In colocated repos git HEAD is detached, so
# git_branch stays empty and this takes over.
[custom.jj]
description = "jj change id + bookmarks"
detect_folders = [".jj"]
ignore_timeout = true
symbol = " "
style = "bold purple"
command = '''jj log -r@ -n1 --no-graph --ignore-working-copy --color never -T 'separate(" ", bookmarks.join(" "), change_id.shortest(4), if(empty, "(empty)"), if(conflict, "×"))' '''
format = "[$symbol$output]($style) "

# Git branch, only on an actual branch outside a jj repo. git_status is
# intentionally omitted: `git status` is slow in large monorepos (the shell
# prompt disables it for the same reason), so the statusline shows branch only.
[custom.git_branch]
when = 'test -n "$(git branch --show-current 2>/dev/null)" && ! jj root >/dev/null 2>&1'
command = "git branch --show-current"
symbol = " "
style = "bold purple"
format = "[$symbol$output]($style)"

[env_var.CLAUDE_MODEL]
variable = "CLAUDE_MODEL"
format = "[$env_value]($style)"
style = "bold blue"

[env_var.CLAUDE_CONTEXT]
variable = "CLAUDE_CONTEXT"
format = "[$env_value]($style)"
style = "bold yellow"

[env_var.CLAUDE_COST]
variable = "CLAUDE_COST"
format = "[$env_value]($style)"
style = "bold green"
