# Starship prompt configuration
# See: https://starship.rs/config/
# Optimized for SPEED - minimal checks

# Don't print a new line at the start of the prompt
add_newline = true

# Timeout for commands - keep low for snappy prompt
command_timeout = 500

# Format - minimal for speed
# directory + git branch + prompt character
format = """
$directory\
$git_branch\
$cmd_duration\
$line_break\
$character"""

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# Git branch - fast, just reads HEAD
[git_branch]
symbol = " "
style = "bold purple"

# Character (prompt symbol)
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Command duration - only shows for long commands
[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

