# Starship prompt configuration
# See: https://starship.rs/config/
# Optimized for SPEED - minimal checks

# Don't print a new line at the start of the prompt
add_newline = true

# Timeout for commands - keep low for snappy prompt
command_timeout = 500

# Format - minimal for speed
# directory + jj/git branch + prompt character
format = """
$directory\
${custom.jj}\
${custom.git_branch}\
$cmd_duration\
$line_break\
$character"""

# Directory
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# Native git_branch prints literal "HEAD" on jj's detached HEAD, so disable it
# and use custom.git_branch (gated to non-jj repos) instead.
[git_branch]
disabled = true

# jj change id + bookmarks. Only runs in jj repos (detect_folders = .jj).
# --ignore-working-copy => never snapshots/mutates, so no oplog spam or races
# with the Claude statusline rendering the same repo. Fast enough (~30ms) to
# stay well under command_timeout.
[custom.jj]
description = "jj change id + bookmarks"
detect_folders = [".jj"]
ignore_timeout = true
symbol = " "
style = "bold purple"
command = '''jj log -r@ -n1 --no-graph --ignore-working-copy --color never -T 'separate(" ", bookmarks.join(" "), change_id.shortest(4), if(empty, "(empty)"), if(conflict, "×"))' '''
format = "[$symbol$output]($style) "

# Git branch, but only on an actual branch that is NOT inside a jj repo (jj owns
# the display there via custom.jj). The `when` gate requires a non-empty branch,
# so plain dirs and jj repos render nothing.
[custom.git_branch]
description = "git branch, hidden inside jj repos"
when = 'test -n "$(git branch --show-current 2>/dev/null)" && ! jj root >/dev/null 2>&1'
command = "git branch --show-current"
symbol = " "
style = "bold purple"
format = "on [$symbol$output]($style) "

# Character (prompt symbol)
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Command duration - only shows for long commands
[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[git_status]
disabled = true

[nodejs]
disabled = true

