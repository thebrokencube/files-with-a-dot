# Shared defaults — system type -> access method
# The folio skill resolves external targets through this file.
# Unlisted systems: pull = skip, push = manual

systems:
  jira:
    pull: cli:acli
    push: cli:acli
    check: "acli --version"
  confluence:
    pull: mcp:jira-confluence
    push: mcp:jira-confluence
  google_docs:
    pull: mcp:gdrive
    push: manual:paste-from-markdown
  google_slides:
    pull: mcp:gdrive
    push: manual
  github:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  github_pr:
    pull: cli:gh
    push: cli:gh
    check: "gh --version"
  slack:
    pull: mcp:slack
    push: mcp:slack
