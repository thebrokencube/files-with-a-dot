# FCIS Refactor + Non-Interactive Mode
#
# Goal: Extract functional core (lib/), make scripts thin orchestrators,
#        add unified non-interactive protocol.
#
# See ARCHITECTURE.md for design details and decision log.
#
# Versioning: completed steps show their actual version tag. Pending steps
# show their semver bump type (patch/minor). Actual version is determined
# at commit time based on the current tag + bump type.

project: fcis-refactor
status: in-progress
started: 2025-02-09

completed:
  - version: v0.4.0
    summary: "dot CLI wrapper, replace df* aliases"

  - version: v0.4.1
    summary: "validation suite and dot validate command"

  - version: v0.4.2
    summary: "add ARCHITECTURE.md and plans/ tracking"

  - version: v0.5.0
    summary: "add config and prompt libraries with dot TTY detection"
    files:
      create: [lib/config.sh, lib/prompt.sh]
      modify: [dot]

  - version: v0.5.1
    summary: "health.sh sources lib/, fix git identity check"
    files:
      modify: [health.sh, dot]

  - version: v0.5.3
    summary: "add lib/shell.sh, wire uninstall.sh to lib/"
    files:
      create: [lib/shell.sh]
      modify: [uninstall.sh]

  - version: v0.6.0
    summary: "consolidate cleanup scripts with lib/brew.sh"
    files:
      create: [lib/brew.sh]
      modify: [cleanup.sh, dot, sync.sh, bootstrap.sh, README.md]
      delete: [brew-cleanup.sh]

  - version: v0.7.0
    summary: "add dot private subcommand, consolidate local/ and profiles"
    files:
      modify: [lib/private.sh, lib/config.sh, lib/brew.sh, dot, sync.sh,
               shared/shell/.shell_common, shared/git/.gitconfig,
               shared/bash/.bashrc.dotfiles, shared/zsh/.zshrc.dotfiles,
               uninstall.sh, .gitignore, templates/private/]
      create: [aggressive/shell.managed]
      delete: [init-private.sh]
    details: |
      Consolidate all private/machine-specific config into the private overlay
      (~/.dotfiles.private/). Remove profile system (work/personal subdirs,
      --profile flag, MACHINE_PROFILE). Eliminate local/ directory — move
      shell.managed to aggressive/, local config files (gitconfig.local,
      env.local, shell.local) live in $HOME and are symlinked by private
      overlay. Add migrate_private_overlay() for legacy detection/cleanup.
      init_private_overlay() adopts existing local files.

  - version: v0.7.1
    summary: "add pending items for status, push, and lib/git.sh work"

  - version: v0.7.2
    summary: "list symlinks and changed files in status commands"
    files:
      modify: [dot, lib/private.sh]

pending:
  - bump: patch
    summary: "add dot private cd subcommand"
    files:
      modify: [dot]
    details: |
      dot private cd prints $HOME/.dotfiles.private (same pattern as dot cd).
      Help text updated with cd action.

  - bump: patch
    summary: "extract shared git_push_with_preview into lib/git.sh"
    files:
      create: [lib/git.sh]
      modify: [lib/private.sh]
    details: |
      New lib/git.sh with git_push_with_preview() and parse_git_status() helpers.
      private_push() slimmed to guard checks + git_push_with_preview call.
      private_status() calls parse_git_status instead of inline parsing.

  - bump: patch
    summary: "add dot push command"
    files:
      modify: [dot]
    details: |
      dot push [message] sources libs, calls git_push_with_preview for the
      main dotfiles repo. Usage text and examples updated.

  - bump: minor
    summary: "thin sync.sh with dot orchestration"
    files:
      modify:
        - sync.sh
        - dot
    details: |
      sync.sh: Source ALL lib/ files. Remove ALL inline duplicated code (colors,
      paths, backup, symlinks, shell config). Remove --skip-prompts flag, use
      DOTFILES_NONINTERACTIVE env var. Add --force flag. Add Homebrew prerequisite
      check (from bootstrap.sh). Replace read -p with confirm/choose. Remove
      cleanup call at end.

      First-time sync completion shows comprehensive "Next steps" section
      (replaces removed dot setup walkthrough): reload shell, open nvim for
      plugins, select iTerm2 profile, run claude auth, verify with dot health.

      Remove dot setup command (D6). Target: ~300 lines (down from 975).

      dot: dot sync orchestrates sync.sh -> cleanup.sh. dot pull orchestrates
      git pull -> sync.sh -> cleanup.sh. Pass "$@" through.

  - bump: patch
    summary: "slim bootstrap.sh to self-contained clone script"
    files:
      modify:
        - bootstrap.sh
    details: |
      Becomes "get the code onto this machine" only: install Xcode CLT if missing,
      clone repo to ~/.dotfiles, exec sync.sh. Self-contained (no lib/ sourcing).
      --force flag sets export DOTFILES_NONINTERACTIVE=1 and auto-handles existing dir.
      No longer installs Homebrew or calls cleanup.sh. Target: ~60-80 lines.

  - bump: patch
    summary: "finalize README and skills for new architecture"
    files:
      modify:
        - ARCHITECTURE.md
        - README.md
        - shared/claude/.claude/skills/dotfiles/SKILL.md
        - shared/claude/.claude/skills/dotfiles-dev/SKILL.md
    details: |
      ARCHITECTURE.md: mark all migration items done.
      README.md: update CLI reference, add Non-Interactive Mode section,
      add Private Overlay section, reference ARCHITECTURE.md.
      Skills: sync with current state.

  - bump: patch
    summary: "add GitHub Actions lint workflow"
    files:
      create:
        - .github/workflows/lint.yml
    details: |
      Runs on ubuntu-latest (shellcheck via apt). Triggers on push to main + PRs.
      Runs ./scripts/validate.sh.
